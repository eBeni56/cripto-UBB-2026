name: Tesztek futtatasa

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Csomagok telepitese
        run: pip install -r requirements.txt

      - name: Pytest futtatasa
        run: pytest